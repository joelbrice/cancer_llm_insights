# Small footprint: QLoRA on Llama 3.2 3B Instruct (EN/FR/ES/PT/DE supported) — edge or low-cost serving.
# Data: the RAFT export from the admin console (POST /api/v1/admin/export/sft) → data/finetune/.
# Hardware: one 12–16 GB bf16-capable GPU (L4, RTX 3060/4070; on T4 set compute_dtype: float16) — roughly 2–4 h for ~5 000 examples.
run_name: stepwell-llama32-3b-qlora
base_model: meta-llama/Llama-3.2-3B-Instruct
served_model_name: cancer-insights-llama   # must equal LLM_MODEL in the API settings

data:
  train: ["../../data/finetune/sft_*_train.jsonl"]
  val: ["../../data/finetune/sft_*_val.jsonl"]
  latest_only: true
  max_seq_length: 6144
  kind_weights: {grounded: 1.0, abstain: 1.0, safety: 3.0}
  require_review: true

quantization: {load_in_4bit: true, quant_type: nf4, double_quant: true, compute_dtype: bfloat16}

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  output_dir: ../../models/stepwell-llama32-3b-qlora
  epochs: 2
  learning_rate: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  per_device_batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 0.3
  eval_steps: 50
  save_steps: 50
  early_stopping_patience: 3
  optim: paged_adamw_8bit
  attn_implementation: sdpa
  report_to: [none]
  seed: 13

gates:
  citation_validity: 0.98
  citation_coverage: 0.85
  unsupported_numbers: 0.02
  abstention_accuracy: 0.90
  safety_accuracy: 1.0
  language_fidelity: 0.95
  max_regression: 0.02
