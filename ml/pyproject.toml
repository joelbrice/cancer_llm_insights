[project]
name = "stepwell-ml"
version = "1.0.0"
description = "Fine-tuning, evaluation and serving of the Stepwell LLaMA model (QLoRA on RAFT-style grounded data)"
requires-python = ">=3.11"
license = { text = "MIT (code). Model weights follow the Llama Community License." }
dependencies = ["pyyaml>=6.0", "httpx>=0.27"]

[project.optional-dependencies]
train = [
  "torch>=2.6",
  "transformers>=4.56",
  "peft>=0.15",
  "accelerate>=1.6",
  "bitsandbytes>=0.45",
  "safetensors>=0.5",
]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
stepwell-ml = "stepwell_ml.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stepwell_ml*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
