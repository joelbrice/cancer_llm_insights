name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Engine (lint + tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest

  ml:
    name: Model pipeline (lint + tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: ml/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check stepwell_ml tests
      - run: pytest tests

  apps:
    name: Shared package, web and mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Shared package (types, i18n completeness, client, lifestyle, plan)
        run: pnpm --filter @stepwell/shared exec tsc --noEmit -p . && pnpm --filter @stepwell/shared test
      - name: Web typecheck + production build
        run: pnpm --filter @stepwell/web exec tsc --noEmit && pnpm --filter @stepwell/web build
      - name: Mobile typecheck + Metro bundle (Android)
        run: |
          pnpm --filter @stepwell/mobile exec tsc --noEmit
          cd mobile && CI=1 npx expo export --platform android --output-dir /tmp/expo-android

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, apps]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: backend, push: false, tags: stepwell-api:ci, build-args: EXTRAS=prod }
      - uses: docker/build-push-action@v6
        with: { context: ., file: web/Dockerfile, push: false, tags: stepwell-web:ci }
