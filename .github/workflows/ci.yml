name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Engine (lint + tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest

  backend-postgres:
    name: Engine on PostgreSQL
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: stepwell, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: stepwell_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U stepwell" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev,postgres]"
      # Production runs on PostgreSQL, which enforces column lengths and types that SQLite ignores.
      - run: pytest
        env: { TEST_DATABASE_URL: "postgresql+psycopg://stepwell@localhost:5432/stepwell_test" }

  ml:
    name: Model pipeline (lint + tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: ml/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check stepwell_ml tests
      - run: pytest tests

  apps:
    name: Shared package, web and mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Shared package (types, i18n completeness, client, lifestyle, plan)
        run: pnpm --filter @stepwell/shared exec tsc --noEmit -p . && pnpm --filter @stepwell/shared test
      - name: Web typecheck + production build
        run: pnpm --filter @stepwell/web exec tsc --noEmit && pnpm --filter @stepwell/web build
      - name: Mobile typecheck + Metro bundle (Android)
        run: |
          pnpm --filter @stepwell/mobile exec tsc --noEmit
          cd mobile && CI=1 npx expo export --platform android --output-dir /tmp/expo-android

  e2e:
    name: End-to-end + accessibility (Playwright, axe)
    runs-on: ubuntu-latest
    needs: [backend, apps]
    # The stack runs as in production: PostgreSQL for data, Redis for the rate limiter.
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: stepwell, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: stepwell }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U stepwell" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql+psycopg://stepwell@localhost:5432/stepwell
      E2E_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e "backend[postgres,queue]"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stepwell/web build
      - run: pnpm --filter @stepwell/web exec playwright install --with-deps chromium
      - run: scripts/e2e/start-stack.sh
      - run: pnpm --filter @stepwell/web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results
            /tmp/stepwell-e2e/*.log

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, apps]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: backend, push: false, tags: stepwell-api:ci, build-args: EXTRAS=prod }
      - uses: docker/build-push-action@v6
        with: { context: ., file: web/Dockerfile, push: false, tags: stepwell-web:ci }

  audit:
    name: Dependency audit and deployment manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - name: Python dependencies (known vulnerabilities)
        run: |
          pip install --upgrade pip setuptools
          pip install pip-audit -e "backend[prod]" -e ml
          pip-audit --skip-editable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # High and critical advisories fail the build. Two unpatched advisories in Expo's command-line tooling (not in
      # the app or the web server) are listed under pnpm.auditConfig in package.json; see docs/SECURITY_REVIEW.md.
      - name: JavaScript dependencies (known vulnerabilities)
        run: pnpm audit --prod --audit-level high
      - name: App store texts within the stores' length limits
        run: python scripts/check_store_listing.py
      - name: Kubernetes manifests (kustomize build + schema validation)
        run: |
          curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for overlay in production staging; do
            cp deploy/k8s/overlays/$overlay/secrets.env.example deploy/k8s/overlays/$overlay/secrets.env
            ./kustomize build deploy/k8s/overlays/$overlay | ./kubeconform -strict -summary -ignore-missing-schemas
          done
