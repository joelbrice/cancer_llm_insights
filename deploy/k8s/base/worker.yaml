# Ingestion, insight generation, evaluation and fine-tuning exports (Redis queue) + the sync scheduler.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app.kubernetes.io/name: worker }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: worker } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: ghcr.io/joelbrice/stepwell-api:latest
          args: ["python", "-m", "app.workers.worker"]
          envFrom:
            - configMapRef: { name: stepwell-config }
            - secretRef: { name: stepwell-secrets }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 4Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: models, mountPath: /models }
            - { name: tmp, mountPath: /tmp }
            - { name: sources, mountPath: /config, readOnly: true }
      volumes:
        - { name: data, emptyDir: { sizeLimit: 20Gi } }
        - { name: models, emptyDir: { sizeLimit: 4Gi } }
        - { name: tmp, emptyDir: {} }
        - { name: sources, configMap: { name: stepwell-sources } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: worker }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 75 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
spec:
  maxUnavailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: worker } }
