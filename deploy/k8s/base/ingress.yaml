# /api → API (streamed answers need buffering off and long reads); everything else → web.
# /metrics, /healthz and /readyz stay cluster-internal (not routed).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stepwell
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
spec:
  ingressClassName: nginx
  tls:
    - hosts: [stepwell.example.org]
      secretName: stepwell-tls
  rules:
    - host: stepwell.example.org
      http:
        paths:
          - { path: /api/, pathType: Prefix, backend: { service: { name: api, port: { name: http } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { name: http } } } }
