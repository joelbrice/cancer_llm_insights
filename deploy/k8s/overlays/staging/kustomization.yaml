# Staging: production-like, in its own namespace, on a staging library and database. Used to smoke-test releases,
# run the platform evaluation and clinically review rebuilt insights before they reach production (BUILD_SPEC §14).
#   cp secrets.env.example secrets.env && edit      # staging credentials, never production ones
#   kubectl apply -k deploy/k8s/overlays/staging
# Host a staging cluster or namespace in the same EU region as production (GDPR: no transfer outside the EU/EEA).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stepwell-staging
resources: [../../base]
components: [../../components/backup]   # nightly backups; run restore drills here first
images:
  - { name: ghcr.io/joelbrice/stepwell-api, newTag: "1.0.0" }
  - { name: ghcr.io/joelbrice/stepwell-web, newTag: "1.0.0" }
secretGenerator:
  - name: stepwell-secrets
    envs: [secrets.env]
    options: { disableNameSuffixHash: false }
labels:
  - pairs: { app.kubernetes.io/instance: staging }
    includeSelectors: false
patches:
  - target: { kind: Ingress, name: stepwell }
    patch: |
      - { op: replace, path: /spec/tls/0/hosts/0, value: staging.stepwell.example }
      - { op: replace, path: /spec/tls/0/secretName, value: stepwell-staging-tls }
      - { op: replace, path: /spec/rules/0/host, value: staging.stepwell.example }
  - target: { kind: ConfigMap, name: stepwell-config }
    patch: |
      - { op: replace, path: /data/ENVIRONMENT, value: staging }
      - { op: replace, path: /data/INSIGHT_REVIEW_REQUIRED, value: "true" }
      - { op: add, path: /data/CORS_ORIGINS, value: "https://staging.stepwell.example" }
      - { op: add, path: /data/QDRANT_URL, value: "http://qdrant.data-staging.svc.cluster.local:6333" }
      - { op: add, path: /data/QDRANT_COLLECTION, value: "cancer_chunks_staging" }
      - { op: add, path: /data/LLM_BASE_URL, value: "http://vllm.llm.svc.cluster.local:8001/v1" }
  # Staging reads its own buckets: a copy of the library, or a subset, never production uploads.
  - target: { kind: ConfigMap, name: stepwell-sources }
    patch: |
      - op: replace
        path: /data/sources.yaml
        value: |
          version: 1
          defaults:
            include: ["**/*.pdf", "**/*.html", "**/*.htm", "**/*.md", "**/*.txt", "**/*.docx", "**/*.xml", "**/*.json", "**/*.jsonl", "**/*.csv"]
          sources:
            - id: research
              name: Research articles (staging)
              uri: s3://stepwell-evidence-staging/research
              storage_options: { key: "${AWS_ACCESS_KEY_ID}", secret: "${AWS_SECRET_ACCESS_KEY}" }
              defaults: { source_type: auto, credibility: peer_reviewed }
            - id: guidelines
              name: Guidelines and agency reports (staging)
              uri: s3://stepwell-evidence-staging/guidelines
              storage_options: { key: "${AWS_ACCESS_KEY_ID}", secret: "${AWS_SECRET_ACCESS_KEY}" }
              defaults: { source_type: guideline, credibility: authoritative }
  # Smaller footprint: one replica each, scaling up only under load tests.
  - target: { kind: HorizontalPodAutoscaler }
    patch: |
      - { op: replace, path: /spec/minReplicas, value: 1 }
      - { op: replace, path: /spec/maxReplicas, value: 3 }
  - target: { kind: Deployment }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
  # Staging is never indexed by search engines.
  - target: { kind: Deployment, name: web }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: NOINDEX, value: "true" }
