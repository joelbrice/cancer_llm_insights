# Insight topic taxonomy — clinical-lead controlled.
#
# Each topic becomes one evidence-graded insight per language once the corpus contains enough evidence
# (INSIGHT_MIN_SOURCES). `anchors` are curated, accent-folded multilingual term prefixes: a passage only counts as
# evidence for a topic if it matches at least one term of EVERY anchor group (precision gate). `guidance` tells the synthesis engine what a complete answer should cover IF the
# evidence supports it — it never adds facts: every statement must be cited from the corpus.
#
# Framework alignment: European Code Against Cancer (IARC), WCRF/AICR Cancer Prevention Recommendations,
# IARC Monographs classifications, WHO physical-activity guidelines, ACS / ASCO / ACSM survivorship guidance,
# MASCC & SIO-ASCO integrative-oncology guidance.
version: 1
topics:
  # ═══════════════════════════ PREVENTION ═══════════════════════════
  - id: tobacco-smoking
    category: tobacco
    audience: [prevention]
