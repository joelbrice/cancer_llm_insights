# Safety rules — clinical-governance controlled content.
# Every change must be reviewed by the Clinical Safety Officer and logged in the hazard log (docs/BUILD_SPEC.md §8).
# Patterns are case-insensitive regular expressions matched against the accent-preserving user message.
#
# levels: emergency (generation blocked, safety response only) > urgent (safety notice first, then answer)
#         > caution (notice + adjusted generation instructions)

rules:
  - id: self_harm
    level: emergency
    block_generation: true
    patterns:
      - "\\b(kill|hurt|harm) myself\\b|(commit|committing|thinking about|thoughts of|want to) (commit )?suicide|\\bsuicidal\\b|end (it all|my life)|take my (own )?life|don'?t want to (live|be alive)|\\bwant to die\\b|wish i (was|were) dead|better off dead|no reason to live|not worth living"
      - "me (tuer|suicider)|me donner la mort|pensées suicidaires|idées suicidaires|mettre fin à (mes jours|ma vie)|envie de mourir|je veux mourir|plus envie de vivre|ne veux plus vivre|en finir avec (la|ma) vie|(veux\\s+|envie d['’]|besoin d['’])en finir\\b(?!\\s+avec\\s+(les?|la|ce|cette|mon|ma|mes)\\s+(trait|chimio|radio|douleur|fatigue|examens?))"
      - "suicidarme|pensamientos suicidas|ideas suicidas|quitarme la vida|matarme|quiero morir(me)?|no quiero (vivir|seguir viviendo)|acabar con (mi vida|todo)|no vale la pena vivir"
      - "suicidar-me|me suicidar|pensamentos suicidas|me matar|matar-me|quero morrer|tirar a minha (própria )?vida|não quero (mais )?viver|acabar com (a minha vida|tudo)|pôr fim à (minha )?vida|não vale a pena viver"
      - "suizidgedanken|suizidal|mich umbringen|mir das leben nehmen|nicht mehr leben (will|möchte)|(will|möchte) nicht mehr leben|(will|möchte) sterben|mein leben beenden|allem ein ende (setzen|machen)|lebensmüde"
  - id: medical_emergency
    level: emergency
    block_generation: true
    patterns:
      - "(severe|crushing) chest pain|chest pain (and|with) (sweat|short(ness)? of breath)|can'?t breathe|cannot breathe|struggling to breathe|choking|coughing up (a lot of )?blood|vomiting blood|bleeding (heavily|that won'?t stop|won'?t stop)|passed out|unconscious|unresponsive|seizure|face drooping|slurred speech|anaphyla"
      - "douleur thoracique (intense|forte)|je n'arrive (plus )?pas à respirer|j'étouffe|crache du sang|vomis du sang|saigne (beaucoup|abondamment)|perte de connaissance|inconscient|convulsion|crise d'épilepsie"
      - "dolor (fuerte|intenso) (en el|de) pecho|no puedo respirar|me ahogo|toso sangre|vomito sangre|sangrado (abundante|que no para)|inconsciente|convulsi"
      - "dor (forte|intensa) no peito|não consigo respirar|tosse com sangue|vomitar sangue|sangramento (intenso|que não para)|inconsciente|convuls"
      - "starke brustschmerzen|keine luft|kann nicht atmen|blut husten|blut erbrechen|starke blutung|bewusstlos|krampfanfall"
  - id: oncologic_urgent
    level: urgent
    block_generation: false
    patterns:
      # febrile neutropenia
      - "(fever|temperature|38|39|40) .{0,40}(chemo|chemotherapy|treatment|neutropen|low white)|(chemo|chemotherapy|neutropen).{0,40}(fever|temperature|chills|shivering)"
      - "(fièvre|température|frissons).{0,40}(chimio|traitement|neutropén)|(chimio|neutropén).{0,40}(fièvre|frissons)"
      - "(fiebre|temperatura|escalofríos).{0,40}(quimio|tratamiento|neutropen)|(quimio|neutropen).{0,40}(fiebre|escalofríos)"
      - "(febre|temperatura|calafrios).{0,40}(quimio|tratamento|neutropen)|(quimio|neutropen).{0,40}(febre|calafrios)"
      - "(fieber|temperatur|schüttelfrost).{0,40}(chemo|behandlung|neutropen)|(chemo|neutropen).{0,40}(fieber|schüttelfrost)"
      # metastatic spinal cord compression
      - "(back pain|neck pain).{0,60}(weak|numb|tingling) (legs?|arms?)|(can'?t|cannot) (control|hold) (my )?(bladder|bowels|urine)|legs? (are |feel |felt |went |got |have gone |suddenly )*(weak|numb|giving way)|(weak|numb)ness in (my |both )?legs"
      - "(mal de dos|douleur dorsale).{0,60}(faiblesse|engourdi)|jambes (faibles|engourdies)|perte de contrôle (de la vessie|des urines|des selles)"
      - "(dolor de espalda).{0,60}(debilidad|entumec)|piernas (débiles|entumecidas)|no puedo controlar (la vejiga|la orina|los esfínteres)"
      - "(dor nas costas).{0,60}(fraqueza|dormência)|pernas (fracas|dormentes)|não consigo controlar (a bexiga|a urina)"
      - "(rückenschmerzen).{0,60}(schwäche|taub)|beine (schwach|taub)|blase nicht (mehr )?kontrollieren"
      # SVC obstruction, thrombosis, severe dehydration, hypercalcaemia
      - "swollen (face|neck).{0,40}(breath|arm)|(swollen|painful) (calf|leg).{0,40}(red|warm|hot)|sudden(ly)? short(ness)? of breath|can'?t keep (any )?(fluids|water) down|vomiting (all day|for \\d+ (hours|days))|extreme(ly)? (thirsty|confused)"
      - "visage (gonflé|enflé)|mollet (gonflé|douloureux)|essoufflement soudain|vomis(sements)? (toute la journée|depuis \\d+)|ne garde (rien|aucun liquide)"
      - "cara hinchada|pantorrilla (hinchada|dolorosa)|falta de aire repentina|vómitos (todo el día|desde hace)"
      - "rosto inchado|panturrilha (inchada|dolorosa)|falta de ar súbita|vómitos (o dia todo|há \\d+)"
      - "geschwollenes gesicht|geschwollene(s|r)? wade|plötzliche atemnot|erbreche (seit|den ganzen tag)"
  - id: diagnosis_request
    level: caution
    block_generation: false
    patterns:
      - "do i have cancer|is (this|it|my \\w+) (a )?cancer|could (this|it) be cancer|am i dying|how long (do|have) i (have )?(left|to live)|what stage (am i|is my)"
      - "(est-ce que )?j'ai (un )?cancer|est-ce (un|que c'est un) cancer|serait-ce un cancer|combien de temps (me reste|il me reste)"
      - "tengo cáncer|¿?es (un )?cáncer|podría ser cáncer|cuánto tiempo me queda"
      - "tenho (um )?(cancro|câncer)|é (um )?(cancro|câncer)|pode ser (cancro|câncer)|quanto tempo me resta"
      - "habe ich krebs|ist (das|es) krebs|könnte (das|es) krebs sein|wie lange habe ich noch"
  - id: treatment_decision
    level: caution
    block_generation: false
    patterns:
      - "(stop|skip|quit|refuse|delay|pause) (my )?(chemo|chemotherapy|radiotherapy|radiation|treatment|immunotherapy|hormone therapy|tamoxifen|surgery)|instead of (chemo|chemotherapy|surgery|radiation|treatment)|how (many|much) (mg|milligrams|dose)|what dose"
      - "(arrêter|refuser|interrompre|sauter|reporter) (ma |la |le |mon )?(chimio|chimiothérapie|radiothérapie|traitement|hormonothérapie|immunothérapie)|au lieu de (la )?(chimio|chimiothérapie|chirurgie)|quelle dose|combien de mg"
      - "(dejar|suspender|rechazar|saltarme) (la |el |mi )?(quimio|quimioterapia|radioterapia|tratamiento)|en lugar de (la )?(quimio|quimioterapia|cirugía)|qué dosis|cuántos mg"
      - "(parar|suspender|recusar|interromper) (a |o |minha |meu )?(quimio|quimioterapia|radioterapia|tratamento)|em vez de (a )?(quimio|quimioterapia|cirurgia)|que dose|quantos mg"
      - "(chemo|chemotherapie|bestrahlung|behandlung|therapie) (abbrechen|absetzen|ablehnen|aussetzen)|statt (der )?(chemo|chemotherapie|operation)|welche dosis|wie viel mg"
  - id: harmful_alternative
    level: caution
    block_generation: false
    patterns:
      - "baking soda|sodium bicarbonate|laetrile|amygdalin|apricot (kernels?|seeds?)|vitamin b17|black salve|bloodroot|gerson|coffee enemas?|\\bmms\\b|chlorine dioxide|fenbendazole|ivermectin|turpentine|alkaline (diet|water).{0,40}(cure|kill|treat)|(cure|cures|kill|kills|starve) cancer|cannabis oil.{0,30}(cure|treat)|essiac|hydrogen peroxide (therapy|drink)"
      - "bicarbonate de soude|noyaux d'abricot|vitamine b17|pommade noire|lavement au café|dioxyde de chlore|guérir le cancer|régime alcalin|affamer (le|les) (cancer|tumeur)|huile de cannabis.{0,30}(guér|soign)"
      - "bicarbonato|semillas? de albaricoque|vitamina b17|enemas? de café|dióxido de cloro|curar el cáncer|dieta alcalina|matar (el|las) (cáncer|células)"
      - "bicarbonato de sódio|caroços? de damasco|vitamina b17|enemas? de café|dióxido de cloro|curar o (cancro|câncer)|dieta alcalina"
      - "natron|aprikosenkerne|vitamin b17|kaffee-?einl[äa]uf|chlordioxid|krebs heilen|basische ernährung.{0,30}(heil|bekämpf)"
  - id: supplement_interaction
    level: caution
    block_generation: false
    patterns:
      - "(st\\.? john'?s wort|turmeric|curcumin|green tea extract|high[- ]dose (vitamin c|antioxidants?|vitamin e)|grapefruit|mistletoe|herbal (supplement|remedy|remedies)|supplements?).{0,60}(chemo|chemotherapy|radiotherapy|radiation|immunotherapy|tamoxifen|treatment|medication)|(chemo|chemotherapy|radiotherapy|tamoxifen|immunotherapy).{0,60}(supplements?|herbs?|turmeric|curcumin|st\\.? john'?s wort|grapefruit|antioxidants?)"
      - "(millepertuis|curcuma|curcumine|extrait de thé vert|antioxydants?|pamplemousse|gui|compléments? alimentaires?|plantes?).{0,60}(chimio|radiothérapie|immunothérapie|tamoxifène|traitement)|(chimio|radiothérapie|tamoxifène).{0,60}(compléments?|plantes?|curcuma|millepertuis|pamplemousse)"
      - "(hierba de san juan|cúrcuma|curcumina|extracto de té verde|antioxidantes?|pomelo|suplementos?).{0,60}(quimio|radioterapia|inmunoterapia|tamoxifeno|tratamiento)"
      - "(erva-de-são-joão|hipericão|açafrão|curcumina|extrato de chá verde|antioxidantes?|toranja|suplementos?).{0,60}(quimio|radioterapia|imunoterapia|tamoxifeno|tratamento)"
      - "(johanniskraut|kurkuma|curcumin|grüntee-?extrakt|antioxidantien|grapefruit|mistel|nahrungsergänzung).{0,60}(chemo|bestrahlung|immuntherapie|tamoxifen|behandlung)"

messages:
  self_harm:
    en: "I'm really sorry you're feeling this way. You deserve support right now. If you might act on these thoughts, please call your local emergency number immediately. You can also reach a crisis line — talking to someone can help."
    fr: "Je suis vraiment désolé·e que vous vous sentiez ainsi. Vous méritez du soutien dès maintenant. Si vous risquez de passer à l'acte, appelez immédiatement les urgences. Vous pouvez aussi joindre une ligne d'écoute — en parler peut aider."
    es: "Siento mucho que te sientas así. Mereces apoyo ahora mismo. Si crees que podrías actuar según estos pensamientos, llama de inmediato al número de emergencias. También puedes contactar una línea de crisis: hablar con alguien puede ayudar."
    pt: "Lamento muito que se sinta assim. Merece apoio agora. Se sentir que pode agir de acordo com estes pensamentos, ligue imediatamente para o número de emergência. Também pode contactar uma linha de apoio — falar com alguém pode ajudar."
    de: "Es tut mir sehr leid, dass es Ihnen so geht. Sie verdienen jetzt Unterstützung. Wenn Sie befürchten, diesen Gedanken nachzugeben, rufen Sie bitte sofort den Notruf. Sie können sich auch an eine Krisenhotline wenden – Reden kann helfen."
  medical_emergency:
    en: "This may be a medical emergency. Please call your local emergency number now (112 in Europe, 911 in North America) or go to the nearest emergency department. Don't wait for an online answer."
    fr: "Il peut s'agir d'une urgence médicale. Appelez immédiatement les urgences (112 en Europe, 15 en France) ou rendez-vous aux urgences les plus proches. N'attendez pas une réponse en ligne."
    es: "Puede tratarse de una urgencia médica. Llame ahora al número de emergencias (112 en Europa) o acuda al servicio de urgencias más cercano. No espere una respuesta en línea."
    pt: "Pode tratar-se de uma emergência médica. Ligue já para o número de emergência (112 na Europa, 192 SAMU no Brasil) ou dirija-se às urgências mais próximas. Não espere por uma resposta online."
    de: "Das könnte ein medizinischer Notfall sein. Rufen Sie bitte sofort den Notruf (112) oder suchen Sie die nächste Notaufnahme auf. Warten Sie nicht auf eine Online-Antwort."
  oncologic_urgent:
    en: "Some symptoms you describe can be urgent during cancer treatment (for example fever during chemotherapy, or new back pain with leg weakness). Contact your oncology team's 24-hour line or emergency services now — don't wait."
    fr: "Certains symptômes que vous décrivez peuvent être urgents pendant un traitement du cancer (par exemple de la fièvre sous chimiothérapie, ou une nouvelle douleur dorsale avec faiblesse des jambes). Contactez maintenant la ligne d'urgence de votre équipe d'oncologie ou le 15/112 — n'attendez pas."
    es: "Algunos síntomas que describe pueden ser urgentes durante el tratamiento del cáncer (por ejemplo, fiebre durante la quimioterapia o dolor de espalda nuevo con debilidad en las piernas). Contacte ahora con la línea de 24 horas de su equipo de oncología o con emergencias: no espere."
    pt: "Alguns sintomas que descreve podem ser urgentes durante o tratamento do cancro (por exemplo, febre durante a quimioterapia ou dor nas costas nova com fraqueza nas pernas). Contacte já a linha de 24 horas da sua equipa de oncologia ou os serviços de emergência — não espere."
    de: "Einige der beschriebenen Symptome können während einer Krebsbehandlung dringend sein (z. B. Fieber unter Chemotherapie oder neue Rückenschmerzen mit Beinschwäche). Kontaktieren Sie jetzt die 24-Stunden-Nummer Ihres onkologischen Teams oder den Notruf – warten Sie nicht."
  diagnosis_request:
    en: "I can't tell whether you have cancer or assess your situation — only a clinician who examines you can. I can share what the research says, and it's worth booking an appointment to get checked."
    fr: "Je ne peux pas dire si vous avez un cancer ni évaluer votre situation — seul un professionnel de santé qui vous examine le peut. Je peux partager ce que dit la recherche, et il est utile de prendre rendez-vous pour vous faire examiner."
    es: "No puedo decir si tiene cáncer ni evaluar su situación: solo un profesional que le examine puede hacerlo. Puedo compartir lo que dice la investigación, y conviene pedir una cita para revisarlo."
    pt: "Não consigo dizer se tem cancro nem avaliar a sua situação — só um profissional de saúde que o examine pode. Posso partilhar o que diz a investigação, e vale a pena marcar uma consulta para ser avaliado."
    de: "Ich kann nicht beurteilen, ob Sie Krebs haben – das kann nur eine Ärztin oder ein Arzt nach einer Untersuchung. Ich kann teilen, was die Forschung sagt; ein Termin zur Abklärung ist sinnvoll."
  treatment_decision:
    en: "Decisions about starting, stopping, delaying or dosing treatment should be made with your oncology team, who know your full situation. I can share general evidence to help you prepare questions for them."
    fr: "Les décisions de commencer, arrêter, reporter un traitement ou d'en modifier la dose doivent être prises avec votre équipe d'oncologie, qui connaît toute votre situation. Je peux partager des données générales pour vous aider à préparer vos questions."
    es: "Las decisiones sobre iniciar, suspender, retrasar o dosificar un tratamiento deben tomarse con su equipo de oncología, que conoce toda su situación. Puedo compartir evidencia general para ayudarle a preparar sus preguntas."
    pt: "As decisões sobre iniciar, parar, adiar ou ajustar a dose de um tratamento devem ser tomadas com a sua equipa de oncologia, que conhece toda a sua situação. Posso partilhar evidência geral para ajudar a preparar perguntas."
    de: "Entscheidungen über Beginn, Abbruch, Verschiebung oder Dosierung einer Behandlung sollten Sie mit Ihrem onkologischen Team treffen, das Ihre gesamte Situation kennt. Ich kann allgemeine Evidenz teilen, damit Sie Fragen vorbereiten können."
  harmful_alternative:
    en: "Some of the approaches mentioned are promoted as cancer cures without reliable evidence, and some can cause serious harm or interfere with effective treatment. Here is what the research actually shows."
    fr: "Certaines approches mentionnées sont présentées comme des remèdes contre le cancer sans preuve fiable, et certaines peuvent être dangereuses ou nuire à l'efficacité des traitements. Voici ce que montre réellement la recherche."
    es: "Algunos de los enfoques mencionados se promocionan como curas del cáncer sin evidencia fiable, y algunos pueden causar daños graves o interferir con tratamientos eficaces. Esto es lo que muestra realmente la investigación."
    pt: "Algumas das abordagens mencionadas são promovidas como curas para o cancro sem evidência fiável, e algumas podem causar danos graves ou interferir com tratamentos eficazes. Eis o que a investigação realmente mostra."
    de: "Einige der genannten Ansätze werden ohne verlässliche Evidenz als Krebsheilmittel beworben; manche können ernsthaft schaden oder wirksame Behandlungen beeinträchtigen. Das zeigt die Forschung tatsächlich."
  supplement_interaction:
    en: "Some supplements, herbs and foods can interact with cancer treatments (for example St John's wort, high-dose antioxidants or grapefruit). Always tell your oncology team and pharmacist about anything you take."
    fr: "Certains compléments, plantes et aliments peuvent interagir avec les traitements du cancer (par exemple le millepertuis, les antioxydants à forte dose ou le pamplemousse). Informez toujours votre équipe d'oncologie et votre pharmacien de tout ce que vous prenez."
    es: "Algunos suplementos, hierbas y alimentos pueden interactuar con los tratamientos del cáncer (por ejemplo, la hierba de San Juan, los antioxidantes en dosis altas o el pomelo). Informe siempre a su equipo de oncología y a su farmacéutico de todo lo que toma."
    pt: "Alguns suplementos, plantas e alimentos podem interagir com os tratamentos do cancro (por exemplo, o hipericão, antioxidantes em doses elevadas ou a toranja). Informe sempre a sua equipa de oncologia e o farmacêutico sobre tudo o que toma."
    de: "Manche Nahrungsergänzungsmittel, Kräuter und Lebensmittel können mit Krebsbehandlungen wechselwirken (z. B. Johanniskraut, hochdosierte Antioxidantien oder Grapefruit). Informieren Sie immer Ihr onkologisches Team und Ihre Apotheke über alles, was Sie einnehmen."

