# Phrases that must never appear in generated output (checked post-generation).
output_rules:
  - id: absolute_claim
    patterns:
      - "\\b(cures?|guarantees?|guaranteed) (your |the )?cancer|100 ?% (effective|protection|safe)|will (definitely|certainly) (prevent|cure)|eliminates? (all )?risk"
      - "guérit (le|votre) cancer|guérison garantie|100 ?% (efficace|sûr)|élimine (tout )?(le )?risque"
      - "cura (el|su) cáncer|garantiza (la )?curación|100 ?% (eficaz|seguro)|elimina (todo )?(el )?riesgo"
      - "cura o (cancro|câncer)|garante a cura|100 ?% (eficaz|seguro)|elimina (todo o )?risco"
      - "heilt (den )?krebs|garantierte heilung|100 ?% (wirksam|sicher)|beseitigt (jedes )?risiko"
  - id: stop_treatment_advice
    patterns:
      - "(you should|you can) (stop|skip|quit) (your )?(treatment|chemo)|no need (to see|for) (a|your) doctor"
      - "vous pouvez arrêter (votre|la) (chimio|traitement)|pas besoin (de voir|d'un) médecin"
      - "puede (dejar|suspender) (su|el) (tratamiento|quimio)|no necesita (ver a|un) médico"
      - "pode (parar|suspender) o (tratamento|quimio)|não precisa (de ver|de um) médico"
      - "können (die|ihre) (behandlung|chemo) (absetzen|abbrechen)|kein arzt nötig"
